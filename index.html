<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Geoguessr Belgium People Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #e1e1df;
        --panel: #ffffff;
        --panel-2: #f3f2ee;
        --ink: #18181b;
        --ink2: #5b5b54;
        --line: #dfddd4;
        --accent: #0b4dff;
        --label: #0b4dff;
        --halo: rgba(240, 239, 224, 0.95);
        --fl: #d97706;
        --br: #7c3aed;
        --wa: #dc2626;
        --ab: #475569;
        --hand:
          "Baloo 2", "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      [hidden] {
        display: none !important;
      }

      #app {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      header.top {
        height: 50px;
        flex-shrink: 0;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        z-index: 30;
        display: flex;
        align-items: center;
        padding: 0 14px;
      }
      .top-in {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }
      .brand {
        font-weight: 700;
        font-size: 15.5px;
        letter-spacing: -0.02em;
        margin: 0;
        white-space: nowrap;
      }
      .brand span {
        font-weight: 500;
        color: var(--ink2);
      }
      .pill {
        background: #eef3ff;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid rgba(11, 77, 255, 0.2);
        white-space: nowrap;
      }
      .sp {
        flex: 1;
      }

      .main {
        display: flex;
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
      }

      aside.side-left {
        width: 280px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        z-index: 25;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      aside.side-right {
        width: 300px;
        flex-shrink: 0;
        background: var(--panel);
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        z-index: 25;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .side-hdr {
        padding: 10px 12px 8px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink2);
      }

      @media (max-width: 960px) {
        aside.side-left {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          width: min(86vw, 300px);
          transform: translateX(-100%);
          box-shadow: 10px 0 30px rgba(0, 0, 0, 0.16);
        }
        aside.side-left.open {
          transform: translateX(0);
        }
        aside.side-right {
          position: absolute;
          top: 0;
          bottom: 0;
          right: 0;
          width: min(88vw, 320px);
          transform: translateX(100%);
          box-shadow: -10px 0 30px rgba(0, 0, 0, 0.16);
        }
        aside.side-right.open {
          transform: translateX(0);
        }
      }
      .scrim {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 20;
        backdrop-filter: blur(1px);
      }
      .scrim.on {
        display: block;
      }

      .pane {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .pbody {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .pad {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      .foot {
        border-top: 1px solid var(--line);
        border-bottom: none;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        background: var(--panel-2);
      }

      .searchbox {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        color: var(--ink2);
      }
      .searchbox:focus-within {
        border-color: var(--accent);
        background: #fff;
        box-shadow: 0 0 0 2px rgba(11, 77, 255, 0.14);
      }
      .searchbox input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 13px;
        color: var(--ink);
      }
      .seg {
        display: flex;
        background: var(--panel-2);
        padding: 3px;
        border-radius: 8px;
        border: 1px solid var(--line);
      }
      .seg.small {
        margin-top: 8px;
      }
      .seg button {
        flex: 1;
        border: none;
        background: transparent;
        padding: 5px 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink2);
        border-radius: 6px;
        cursor: pointer;
      }
      .seg button.on {
        background: var(--panel);
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      .filters {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
        font-size: 12px;
      }
      .filters select {
        flex: 1;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
        color: var(--ink);
        outline: none;
      }
      .chk {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--ink2);
        cursor: pointer;
        white-space: nowrap;
        font-weight: 500;
      }

      .list {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
      }
      .list.az-list {
        padding-top: 0;
      }
      .gh {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 10px 5px;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.015em;
        color: #000000;
      }
      .gh .link,
      .gh span:first-child {
        color: #000000 !important;
        text-decoration: none;
        font-size: 16px;
        font-weight: 800;
      }
      .gh .link:hover {
        text-decoration: underline;
        color: #000000;
      }
      .gh.az-letter {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--panel);
        padding-top: 8px;
        border-bottom: 1px solid var(--line);
      }
      .gh span:last-child {
        font-size: 12px;
        font-weight: 700;
        color: var(--ink2);
        background: var(--panel-2);
        padding: 1px 7px;
        border-radius: 99px;
      }
      .row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        border: none;
        background: transparent;
        border-radius: 8px;
        cursor: pointer;
        text-align: left;
        transition: background 0.12s;
      }
      .row:hover {
        background: var(--panel-2);
      }
      .row.on {
        background: rgba(11, 77, 255, 0.1);
        outline: 1px solid rgba(11, 77, 255, 0.28);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        flex-shrink: 0;
      }
      .rn {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      .rn b {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rn b.hand {
        font-family: var(--hand);
        font-size: 13.5px;
        color: var(--label);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .rn small {
        font-size: 11.5px;
        color: var(--ink2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cnt {
        background: var(--panel-2);
        color: var(--ink2);
        font-size: 11.5px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 99px;
      }
      .cnt.big {
        font-size: 13px;
        padding: 3px 10px;
        background: rgba(11, 77, 255, 0.1);
        color: var(--accent);
      }
      .empty {
        padding: 28px 16px;
        text-align: center;
        color: var(--ink2);
        font-size: 13px;
      }

      .dh {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--panel-2);
      }
      .dt {
        font-weight: 700;
        font-size: 15px;
        color: var(--ink);
      }
      .ds {
        font-size: 12px;
        color: var(--ink2);
      }

      section#mapwrap {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: #c6def1;
        cursor: grab;
        touch-action: none;
      }
      section#mapwrap.panning {
        cursor: grabbing;
      }
      section#mapwrap.placing {
        cursor: crosshair !important;
      }

      #world {
        position: absolute;
        top: 0;
        left: 0;
        width: 1136px;
        height: 988px;
        transform-origin: 0 0;
        will-change: transform;
        pointer-events: none;
      }
      #mapimg {
        object-fit: fill;
        display: block;
        width: 1136px;
        height: 988px;
        user-select: none;
        -webkit-user-drag: none;
      }
      #fx {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 4;
      }
      #labs {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 6;
      }

      .lab {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: auto;
        font-family: var(--hand);
        font-size: inherit;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.025em;
        color: var(--label);
        background: transparent;
        border: none;
        padding: 1px 3px;
        margin: 0;
        line-height: 0.98;
        white-space: nowrap;
        cursor: pointer;
        border-radius: 4px;
        text-shadow:
          -1.3px -1.3px 0 var(--halo),
          1.3px -1.3px 0 var(--halo),
          -1.3px 1.3px 0 var(--halo),
          1.3px 1.3px 0 var(--halo),
          0px 0px 3px var(--halo);
        transition:
          opacity 0.15s,
          color 0.12s,
          background-color 0.12s;
        will-change: transform;
      }
      .lab:hover,
      .lab.hl {
        color: #0026b3;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 2px 8px rgba(11, 77, 255, 0.25);
        z-index: 20;
      }
      .lab.sel {
        color: #ffffff;
        background: var(--accent);
        text-shadow: none;
        padding: 2px 6px;
        box-shadow: 0 3px 12px rgba(11, 77, 255, 0.45);
        z-index: 30;
      }
      .lab.dim {
        opacity: 0.22;
      }

      #edges {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 12;
        overflow: hidden;
      }
      .edge {
        position: absolute;
        top: 0;
        left: 0;
        height: 26px;
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0 9px 0 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.95);
        color: var(--label);
        border: 1.5px solid rgba(11, 77, 255, 0.4);
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.14);
        font-family: var(--hand);
        font-weight: 800;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        transition:
          background 0.15s,
          border-color 0.15s,
          box-shadow 0.15s;
        will-change: transform;
      }
      .edge:hover,
      .edge.sel {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        box-shadow: 0 4px 14px rgba(11, 77, 255, 0.38);
        z-index: 15;
      }
      .edge .arr {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .edge .nm {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ctl {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 16;
        display: flex;
        flex-direction: column;
        gap: 5px;
        background: rgba(255, 255, 255, 0.94);
        padding: 5px;
        border-radius: 12px;
        border: 1px solid var(--line);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(6px);
      }

      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.12s;
      }
      .icon-btn:hover {
        background: var(--panel-2);
      }
      .icon-btn.sm {
        width: 28px;
        height: 28px;
      }
      .icon-btn.toggle[aria-pressed="true"] {
        background: rgba(11, 77, 255, 0.12);
        color: var(--accent);
        border-color: rgba(11, 77, 255, 0.25);
      }
      .menu-btn {
        display: none;
      }
      @media (max-width: 960px) {
        .menu-btn {
          display: inline-flex;
        }
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 11px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        transition: all 0.12s;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--panel-2);
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .btn.primary:hover {
        background: #003be0;
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--ink2);
      }
      .btn.ghost:hover {
        background: var(--panel-2);
        color: var(--ink);
      }
      .btn.danger {
        background: #dc2626;
        color: #fff;
        border-color: #dc2626;
      }
      .btn.danger-ghost {
        background: transparent;
        border-color: transparent;
        color: #dc2626;
      }
      .btn.danger-ghost:hover {
        background: #fef2f2;
      }

      .link,
      .linkbtn {
        border: none;
        background: transparent;
        padding: 0;
        color: #000000;
        font-weight: 700;
        font-size: inherit;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .linkbtn {
        color: #93c5fd;
        margin-left: 10px;
        text-decoration: none;
      }

      #card {
        position: absolute;
        bottom: 16px;
        left: 16px;
        z-index: 18;
        width: min(340px, calc(100% - 32px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
        padding: 14px;
        pointer-events: auto;
      }
      .card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .card-name {
        font-family: var(--hand);
        font-size: 20px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--label);
        line-height: 1.1;
      }
      .card-sub {
        font-size: 12.5px;
        color: #000000;
        font-weight: 600;
        margin-top: 3px;
      }
      .card-sub .link {
        color: #000000;
        font-weight: 700;
        text-decoration-color: #71717a;
      }
      .card-sub .link:hover {
        color: #000000;
        text-decoration-color: #000000;
      }
      .card-loc {
        font-size: 12.5px;
        font-weight: 700;
        color: #000000;
        margin-top: 4px;
      }
      .card-act {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .confirm p {
        margin: 10px 0 6px;
        font-size: 13px;
        color: var(--ink);
      }

      #banner {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 22;
        background: #18181b;
        color: #fff;
        padding: 8px 14px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      }

      .form {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 10px;
      }
      .geo-fields {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form label,
      .dlg label {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ink2);
        margin-top: 4px;
      }
      .form input,
      .dlg input {
        width: 100%;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        font-size: 13px;
        color: var(--ink);
        outline: none;
      }
      .form input:focus,
      .dlg input:focus {
        border-color: var(--accent);
        background: #fff;
      }
      .acwrap {
        position: relative;
      }
      .sug {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 4px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        margin: 0;
        padding: 4px;
        list-style: none;
        max-height: 190px;
        overflow-y: auto;
        z-index: 50;
      }
      .sug li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .sug li small {
        color: var(--ink2);
        font-size: 11px;
      }
      .sug li.on,
      .sug li:hover {
        background: var(--panel-2);
        color: var(--accent);
        font-weight: 600;
      }
      .row-btns {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      #dlgwrap {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .dlg-bg {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(2px);
      }
      .dlg {
        position: relative;
        width: min(400px, 100%);
        background: var(--panel);
        border-radius: 16px;
        border: 1px solid var(--line);
        padding: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .dlg h2 {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 700;
      }
      .err {
        color: #dc2626;
        font-size: 12px;
        margin: 4px 0 0;
        font-weight: 500;
      }

      #toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 70;
        background: #18181b;
        color: #fff;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
        display: flex;
        align-items: center;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module">
      "use strict";

        if (ptrs.size === 1)
          drag = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
        else if (ptrs.size === 2) {
          const [a, b] = [...ptrs.values()];
          const r = mapEl.getBoundingClientRect();
          pinch = {
            d: Math.hypot(a.x - b.x, a.y - b.y) || 1,
            z: view.z,
            cx: (a.x + b.x) / 2 - r.left,
            cy: (a.y + b.y) / 2 - r.top,
            vx: view.x,
            vy: view.y,
          };
          drag = null;
          moved = true;
        }
      });
      mapEl.addEventListener("pointermove", (e) => {
        if (!ptrs.has(e.pointerId)) return;
        ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pinch && ptrs.size >= 2) {
          const [a, b] = [...ptrs.values()];
          const r = mapEl.getBoundingClientRect();
          const d = Math.hypot(a.x - b.x, a.y - b.y) || 1,
            nz = clamp((pinch.z * d) / pinch.d, fit, fit * 18);
          const ix = (pinch.cx - pinch.vx) / pinch.z,
            iy = (pinch.cy - pinch.vy) / pinch.z;
          const ccx = (a.x + b.x) / 2 - r.left,
            ccy = (a.y + b.y) / 2 - r.top;
          view.z = nz;
          view.x = ccx - ix * nz;
          view.y = ccy - iy * nz;
          clampView();
          schedule();
        } else if (drag) {
          const dx = e.clientX - drag.sx,
            dy = e.clientY - drag.sy;
          if (!moved && Math.hypot(dx, dy) > 5) {
            moved = true;
            try {
              mapEl.setPointerCapture(e.pointerId);
            } catch (_) {}
            mapEl.classList.add("panning");
          }
          if (moved) {
            view.x = drag.vx + dx;
            view.y = drag.vy + dy;
            clampView();
            schedule();
          }
        }
      });
      const endPtr = (e) => {
        if (!ptrs.has(e.pointerId)) return;
        ptrs.delete(e.pointerId);
        if (ptrs.size < 2) pinch = null;
        if (ptrs.size === 1) {
          const [p] = [...ptrs.values()];
          drag = { sx: p.x, sy: p.y, vx: view.x, vy: view.y };
        }
        if (ptrs.size === 0) {
          drag = null;
          mapEl.classList.remove("panning");
          if (moved) {
            suppress = true;
            setTimeout(() => {
              suppress = false;
            }, 0);
          }
        }
      };
      mapEl.addEventListener("pointerup", endPtr);
      mapEl.addEventListener("pointercancel", endPtr);
      mapEl.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          cancelAnimationFrame(anim);
          const r = mapEl.getBoundingClientRect(),
            k = e.ctrlKey ? 0.01 : 0.0016;
          zoomAt(
            e.clientX - r.left,
            e.clientY - r.top,
            Math.exp(-e.deltaY * (e.deltaMode === 1 ? 16 : 1) * k),
          );
        },
        { passive: false },
      );
      mapEl.addEventListener("dblclick", (e) => {
        if (e.target.closest(".lab,.ctl,#card,.edge") || placing) return;
        const r = mapEl.getBoundingClientRect(),
          p = toImg(e.clientX - r.left, e.clientY - r.top),
          z = clamp(view.z * 2, fit, fit * 18);
        animateTo(
          {
            z,
            x: e.clientX - r.left - p.x * z,
            y: e.clientY - r.top - p.y * z,
          },
          300,
        );
      });
      mapEl.addEventListener("click", (e) => {
        if (suppress) return;
        if (placing) {
          if (e.target.closest(".ctl,#banner,#card")) return;
          const r = mapEl.getBoundingClientRect(),
            p = toImg(e.clientX - r.left, e.clientY - r.top);
          const cb = placing.cb;
          endPlacing();
          cb(p.x, p.y);
          return;
        }
        if (!e.target.closest(".lab,.ctl,#card,.edge")) {
          const r = mapEl.getBoundingClientRect();
          const point = toImg(e.clientX - r.left, e.clientY - r.top);
          const nearest = nearestMunicipalityAt(point.x, point.y);
          if (nearest) {
            openDetail({ t: "prov", k: nearest.p });
            return;
          }
          if (selId) select(null);
        }
      });
      $("#zin").onclick = () => stepZoom(1.7);
      $("#zout").onclick = () => stepZoom(1 / 1.7);
      $("#zfit").onclick = () => {
        ui.detail = null;
        paintLabels();
        renderRightSide();
        const z = fit;
        animateTo({ z, x: cw / 2 - BE.cx * z, y: ch / 2 - BE.cy * z });
      };
      $("#ztown").onclick = (e) => {
        ui.towns = !ui.towns;
        e.currentTarget.setAttribute("aria-pressed", String(ui.towns));
        schedule();
      };

      /*labels*/
      const labels = new Map(),
        chips = new Map();
      function syncLabels() {
        const ids = new Set(people.map((p) => p.id));
        for (const [id, el] of labels)
          if (!ids.has(id)) {
            el.remove();
            labels.delete(id);
          }
        for (const [id, el] of chips)
          if (!ids.has(id)) {
            el.remove();
            chips.delete(id);
          }
        for (const p of people) {
          let el = labels.get(p.id);
          if (!el) {
            el = h("button", {
              class: "lab",
              type: "button",
              onclick: (e) => {
                if (suppress) return;
                e.stopPropagation();
                select(p.id, { fly: false });
              },
              onpointerenter: () => {
                hoverId = p.id;
                paintLabels();
              },
              onpointerleave: () => {
                hoverId = null;
                paintLabels();
              },
            });
            labsEl.append(el);
            labels.set(p.id, el);
          }
          if (el.textContent !== p.n) el.textContent = p.n;
          el.setAttribute("aria-label", `${p.n}, ${placeText(p)}`);
        }
      }
      function paintLabels() {
        const dimFn = ui.detail
          ? ui.detail.t === "prov"
            ? (p) => provOf(p) !== ui.detail.k
            : (p) => p.m !== ui.detail.k
          : null;
        for (const p of people) {
          const el = labels.get(p.id);
          if (!el) continue;
          el.classList.toggle("sel", p.id === selId);
          el.classList.toggle("hl", p.id === hoverId && p.id !== selId);
          el.classList.toggle("dim", !!dimFn && dimFn(p) && p.id !== selId);
        }
        schedule();
      }

      /*render*/
      function render() {
        raf = 0;
        world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`;
        const zr = view.z / fit,
          fs = clamp(11.8 * Math.pow(zr, 0.15), 11.5, 14.5);
        labsEl.style.fontSize = fs + "px";
        const vis = [],
          off = [];

        // Keep person labels close to their location while zoomed out, then ease
        // them to the normal readable clearance by the city-name zoom threshold.
        // The clearance is measured from the nearest edge of the label to the dot.
        const cityNameZoom = 3.5;
        const zoomProgress = clamp((zr - 1) / (cityNameZoom - 1), 0, 1);
        const edgeGap = 1.5 + (5 - 1.5) * zoomProgress;
        const labelStep = fs + 2;
        const sideCounts = new Map();
        for (const p of people) {
          const m = muniOf(p);
          const position = mapPosition(p);
          if (!position) continue; // Never feed missing/invalid coordinates into edge-arrow math.
          let ix = position.x,
            iy = position.y,
            anchor = "below";

          if (m) {
            // Alternate from below first, so a town with one person always has
            // that person's name underneath its town marker. Odd groups have
            // one extra label below; the two sides stay as balanced as possible.
            const idx = sideCounts.get(m.n) || 0;
            sideCounts.set(m.n, idx + 1);
            const below = idx % 2 === 0;
            const rank = Math.floor(idx / 2);
            anchor = below ? "below" : "above";
            const screenOffset = edgeGap + rank * labelStep;
            iy = m.y + (below ? screenOffset : -screenOffset) / view.z;
          } else {
            // Standalone / international pins use the same zoom-responsive
            // clearance and below-the-dot default as single-person towns.
            iy = position.y + edgeGap / view.z;
          }

          const sx = ix * view.z + view.x,
            sy = iy * view.z + view.y;
          if (!Number.isFinite(sx) || !Number.isFinite(sy)) continue;
          const o = { p, sx, sy, cx: sx, cy: sy, anchor };
          const inside = sx >= 0 && sx <= cw && sy >= 0 && sy <= ch;

          if (inside) vis.push(o);
          else off.push(o);
        }

        const shown = new Set();
        for (const o of vis) {
          const el = labels.get(o.p.id);
          if (!el) continue;
          const verticalAnchor = o.anchor === "above" ? "-100%" : "0";
          el.style.display = "";
          el.style.transform = `translate(${o.cx.toFixed(1)}px,${o.cy.toFixed(1)}px) translate(-50%,${verticalAnchor})`;
          shown.add(o.p.id);
        }
        for (const p of people) {
          if (!shown.has(p.id)) {
            const el = labels.get(p.id);
            if (el) el.style.display = "none";
          }
        }

        drawFx(zr);
        updateEdges(off);
      }

      function drawFx(zr) {
        const c = fctx;
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        c.clearRect(0, 0, cw, ch);
        const tx = (m) => m.x * view.z + view.x,
          ty = (m) => m.y * view.z + view.y;
        const detailProv =
          ui.detail && ui.detail.t === "prov" ? ui.detail.k : null;
        const detailMuni =
          ui.detail && ui.detail.t === "muni"
            ? muniByName.get(ui.detail.k)
            : null;

        if (detailProv) {
          c.fillStyle = "rgba(11, 77, 255, 0.4)";
          for (const m of MUNI)
            if (m.p === detailProv) {
              const x = tx(m),
                y = ty(m);
              if (x < -5 || y < -5 || x > cw + 5 || y > ch + 5) continue;
              c.beginPath();
              c.arc(x, y, clamp(2 + zr * 0.25, 2.5, 5), 0, 7);
              c.fill();
            }
        }
        if (ui.towns && zr >= 2.4) {
          const drawn = [],
            withPeople = new Set(people.map((p) => p.m));
          const list = MUNI.filter((m) => {
            const x = tx(m),
              y = ty(m);
            return x > -30 && y > -10 && x < cw + 30 && y < ch + 10;
          });
          list.sort(
            (a, b) =>
              (withPeople.has(b.n) ? 1 : 0) - (withPeople.has(a.n) ? 1 : 0),
          );
          c.font = `500 11px system-ui, sans-serif`;
          c.textBaseline = "middle";
          c.textAlign = "left";
          for (const m of list) {
            const x = tx(m),
              y = ty(m);
            c.fillStyle = "#5b5b54";
            c.beginPath();
            c.arc(x, y, 2.5, 0, 7);
            c.fill();
            if (zr >= 3.5) {
              const w = c.measureText(m.n).width,
                r = { x0: x + 5, y0: y - 7, x1: x + 5 + w, y1: y + 7 };
              if (
                drawn.some(
                  (d) =>
                    r.x0 < d.x1 && r.x1 > d.x0 && r.y0 < d.y1 && r.y1 > d.y0,
                )
              )
                continue;
              drawn.push(r);
              c.lineWidth = 3;
              c.strokeStyle = "rgba(255,255,255,0.85)";
              c.strokeText(m.n, x + 5, y);
              c.fillText(m.n, x + 5, y);
            }
          }
        }
        if (detailMuni) {
          const x = tx(detailMuni),
            y = ty(detailMuni);
          c.strokeStyle = "#0b4dff";
          c.lineWidth = 2;
          c.beginPath();
          c.arc(x, y, 9, 0, 7);
          c.stroke();
          c.fillStyle = "#0b4dff";
          c.beginPath();
          c.arc(x, y, 3, 0, 7);
          c.fill();
          c.font = `600 12px system-ui, sans-serif`;
          c.textBaseline = "middle";
          c.textAlign = "left";
          c.lineWidth = 4;
          c.strokeStyle = "rgba(255,255,255,0.9)";
          c.strokeText(detailMuni.n, x + 14, y);
          c.fillText(detailMuni.n, x + 14, y);
        }
      }

      /*off-screen indicators*/
      function chipFor(p) {
        let el = chips.get(p.id);
        if (!el) {
          el = h(
            "button",
            {
              class: "edge",
              type: "button",
              onclick: () => select(p.id, { fly: true }),
            },
            h("span", { class: "arr" }, svgIcon(ICON.arrow, 14)),
            h("span", { class: "nm" }),
          );
          edgesEl.append(el);
          chips.set(p.id, el);
        }
        const nm = el.querySelector(".nm");
        if (nm.textContent !== p.n) nm.textContent = p.n;
        return el;
      }
      function updateEdges(off) {
        const used = new Set();
        const cx = cw / 2,
          cy = ch / 2,
          m = 12;
        for (const o of off) {
          const dx = o.sx - cx,
            dy = o.sy - cy;
          if (
            !Number.isFinite(dx) ||
            !Number.isFinite(dy) ||
            (dx === 0 && dy === 0)
          )
            continue;
          const tx = dx === 0 ? Infinity : (cw / 2 - m) / Math.abs(dx);
          const ty = dy === 0 ? Infinity : (ch / 2 - m) / Math.abs(dy);
          const t = Math.min(tx, ty);
          if (!Number.isFinite(t) || t < 0) continue;
          const ex = cx + dx * t,
            ey = cy + dy * t;
          const ang = Math.atan2(dy, dx); // SVG arrow points east at 0°, so this is the correct map bearing.

          const el = chipFor(o.p);
          used.add(o.p.id);
          el.style.display = "";
          const wEst = 34 + o.p.n.length * 7;
          const px = Math.min(cw - wEst, Math.max(m, ex - wEst / 2));
          const py = Math.min(ch - 30, Math.max(m, ey - 13));

          el.style.transform = `translate(${px}px,${py}px)`;
          el.firstChild.style.transform = `rotate(${((ang * 180) / Math.PI).toFixed(0)}deg)`;
          el.classList.toggle("sel", o.p.id === selId);
        }
        for (const [id, el] of chips)
          if (!used.has(id)) el.style.display = "none";
      }

      /*selection & card*/
      function select(id, opts = {}) {
        selId = id;
        cardMode = "view";
        const p = id && byId(id),
          position = p && mapPosition(p);
        if (position && opts.fly !== false)
          flyTo(position.x, position.y, Math.max(view.z / fit, 4.5));
        if (position && opts.fly === false) {
          const sx = position.x * view.z + view.x,
            sy = position.y * view.z + view.y;
          if (sx < 40 || sy < 40 || sx > cw - 40 || sy > ch - 40)
            flyTo(position.x, position.y, view.z / fit);
        }
        renderCard();
        paintLabels();
        renderPeopleList();
        if (ui.detail) renderDetailList();
      }
      function renderCard() {
        const p = selId && byId(selId);
        if (!p) {
          card.hidden = true;
          card.replaceChildren();
          schedule();
          return;
        }
        card.hidden = false;
        const m = muniOf(p);
        const subNodes = m
          ? [
              h("button", {
                class: "link",
                text: m.n,
                onclick: () => openDetail({ t: "muni", k: m.n }),
              }),
              " · ",
              h("button", {
                class: "link",
                text: PROV[m.p].n,
                onclick: () => openDetail({ t: "prov", k: m.p }),
              }),
            ]
          : [h("span", { text: p.loc || "Outside Belgium" })];

        const head = h(
          "div",
          { class: "card-head" },
          h(
            "div",
            { class: "card-title" },
            h("div", { class: "card-name", text: p.n }),
            h("div", { class: "card-sub" }, ...subNodes),
            p.loc && m
              ? h("div", { class: "card-loc", text: `Locality: ${p.loc}` })
              : null,
          ),
          h(
            "button",
            {
              class: "icon-btn sm",
              "aria-label": "Close",
              onclick: () => select(null),
            },
            svgIcon(ICON.close, 16),
          ),
        );

        const act = h("div", { class: "card-act" });
        const position = mapPosition(p);
        if (position)
          act.append(
            h(
              "button",
              {
                class: "btn",
                onclick: () =>
                  flyTo(position.x, position.y, Math.max(view.z / fit, 6)),
              },
              svgIcon(ICON.pin, 16),
              " Zoom to",
            ),
          );

        if (isAdmin) {
          act.append(
            h(
              "button",
              {
                class: "btn",
                onclick: () => {
                  cardMode = "edit";
                  renderCard();
                },
              },
              svgIcon(ICON.edit, 16),
              " Edit",
            ),
          );
          act.append(
            h(
              "button",
              {
                class: "btn danger-ghost",
                onclick: () => {
                  cardMode = "remove";
                  renderCard();
                },
              },
              svgIcon(ICON.trash, 16),
              " Remove",
            ),
          );
        }

        if (cardMode === "edit" && isAdmin) {
          card.replaceChildren(head, editForm(p));
          schedule();
          return;
        }
        if (cardMode === "remove" && isAdmin) {
          card.replaceChildren(
            head,
            h(
              "div",
              { class: "confirm" },
              h("p", { text: `Remove ${p.n} from the map?` }),
              h(
                "div",
                { class: "row-btns" },
                h("button", {
                  class: "btn danger",
                  text: "Remove",
                  onclick: () => removePerson(p.id),
                }),
                h("button", {
                  class: "btn",
                  text: "Keep",
                  onclick: () => {
                    cardMode = "view";
                    renderCard();
                  },
                }),
              ),
            ),
          );
          schedule();
          return;
        }
        card.replaceChildren(head, act);
        schedule();
      }

      function editForm(p) {
        const nameIn = h("input", {
          type: "text",
          value: p.n,
          maxlength: "40",
          autocomplete: "off",
        });
        const m = muniOf(p);
        const muniIn = h("input", {
          type: "text",
          value: m ? m.n : p.m || "",
          placeholder: "Belgian municipality (leave empty for abroad)",
          autocomplete: "off",
        });
        const locIn = h("input", {
          type: "text",
          value: p.loc || "",
          placeholder: "City, Country (e.g. Ulft, Netherlands)",
          autocomplete: "off",
        });
        const latIn = h("input", {
          type: "number",
          step: "any",
          value: p.lat == null ? "" : String(p.lat),
          placeholder: "e.g. 51.8910",
        });
        const lonIn = h("input", {
          type: "number",
          step: "any",
          value: p.lon == null ? "" : String(p.lon),
          placeholder: "e.g. 6.3843",
        });
        const geoFields = h(
          "div",
          { class: "geo-fields", hidden: true },
          h("label", { text: "Latitude" }),
          latIn,
          h("label", { text: "Longitude" }),
          lonIn,
        );
        const sug = h("ul", { class: "sug", hidden: true });
        let picked = m;
        const placePinBtn = h(
          "button",
          {
            class: "btn",
            type: "button",
            onclick: () => {
              const current = byId(p.id) || p;
              select(null);
              startPlacing(`Click the map to reposition ${p.n}.`, (nx, ny) => {
                const placement = placementForBelgianMapPoint(
                  nx,
                  ny,
                  muniOf(current) ? current.loc : "",
                );
                update(p.id, placement);
                select(p.id, { fly: false });
                toast(
                  placement.m
                    ? `Updated position for ${p.n} near ${placement.m}`
                    : `Updated position for ${p.n}`,
                );
              });
            },
          },
          svgIcon(ICON.pin, 14),
          " Place pin on map",
        );
        const syncGeoVisibility = () => {
          const international = isInternationalCityCountry(locIn.value, picked);
          geoFields.hidden = !international;
          placePinBtn.hidden = international;
        };
        autocomplete(muniIn, sug, (mm) => {
          picked = mm;
          syncGeoVisibility();
        });
        muniIn.addEventListener("input", syncGeoVisibility);
        locIn.addEventListener("input", syncGeoVisibility);
        syncGeoVisibility();

        const save = () => {
          const n = nameIn.value.trim();
          if (!n) return;
          const typed = norm(muniIn.value);
          if (typed && (!picked || norm(picked.n) !== typed)) {
            const exact = MUNI.find(
              (q) => norm(q.n) === typed || q.al.some((a) => norm(a) === typed),
            );
            if (exact) picked = exact;
            else {
              toast(
                "Unknown Belgian municipality. Leave this empty for an international city.",
              );
              return;
            }
          }
          if (!typed) picked = null;

          const geo = parseGeoInputs(latIn.value, lonIn.value);
          if (geo.error) {
            toast(geo.error);
            return;
          }
          const loc = locIn.value.trim();
          const international = isInternationalCityCountry(loc, picked);
          const patch = { n, m: picked ? picked.n : "", loc };

          if (international) {
            if (!geo.value && !hasGeoCoordinates(p)) {
              toast(
                "Enter latitude and longitude for this international city.",
              );
              latIn.focus();
              return;
            }
            const coords = geo.value || {
              lat: Number(p.lat),
              lon: Number(p.lon),
            };
            patch.m = "";
            patch.lat = coords.lat;
            patch.lon = coords.lon;
            patch.x = Math.round(geoX(coords.lon) * 10) / 10;
            patch.y = Math.round(geoY(coords.lat) * 10) / 10;
          } else if (picked) {
            if (!m || picked.n !== m.n) {
              patch.x = picked.x;
              patch.y = picked.y;
            }
            patch.lat = null;
            patch.lon = null;
          } else if (geo.value) {
            patch.lat = geo.value.lat;
            patch.lon = geo.value.lon;
            patch.x = Math.round(geoX(geo.value.lon) * 10) / 10;
            patch.y = Math.round(geoY(geo.value.lat) * 10) / 10;
          } else {
            patch.lat = null;
            patch.lon = null;
          }
          update(p.id, patch);
          cardMode = "view";
          renderCard();
        };

        return h(
          "div",
          { class: "form", onclick: (e) => e.stopPropagation() },
          h("label", { text: "Name" }),
          nameIn,
          h("label", { text: "Belgian municipality" }),
          h("div", { class: "acwrap" }, muniIn, sug),
          h("label", { text: "City, Country (For non Belgians)" }),
          locIn,
          geoFields,
          h(
            "div",
            { class: "row-btns" },
            h("button", { class: "btn primary", text: "Done", onclick: save }),
            placePinBtn,
            h("button", {
              class: "btn ghost",
              text: "Cancel",
              onclick: () => {
                cardMode = "view";
                renderCard();
              },
            }),
          ),
        );
      }

      /*placement mode*/

      /*autocomplete*/
      function searchMuni(q, limit = 8) {
        const nq = norm(q);
        if (!nq) return [];
        const toks = nq.split(" ");
        const out = [];
        for (const m of MUNI) {
          if (!toks.every((t) => m.k.includes(t))) continue;
          out.push([m.k.startsWith(nq) ? 0 : 1, m]);
        }
        return out
          .sort((a, b) => a[0] - b[0] || a[1].n.localeCompare(b[1].n))
          .slice(0, limit)
          .map((x) => x[1]);
      }
      function autocomplete(input, list, onPick) {
        let items = [],
          idx = -1;
        const draw = () => {
          list.replaceChildren(
            ...items.map((m, i) =>
              h(
                "li",
                {
                  class: i === idx ? "on" : "",
                  onmousedown: (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    pick(m);
                  },
                },
                h("span", { text: m.n }),
                h("small", { text: PROV[m.p].n }),
              ),
            ),
          );
          list.hidden = !items.length;
        };
        const pick = (m) => {
          input.value = m.n;
          items = [];
          draw();
          onPick(m);
        };
        input.addEventListener("input", () => {
          items = searchMuni(input.value);
          idx = items.length ? 0 : -1;
          draw();
          onPick(null);
        });
        input.addEventListener("focus", () => {
          if (input.value && !items.length) {
            items = searchMuni(input.value);
            idx = items.length ? 0 : -1;
            draw();
          }
        });
        input.addEventListener("blur", () =>
          setTimeout(() => {
            items = [];
            draw();
          }, 200),
        );
        input.addEventListener("keydown", (e) => {
          if (!items.length) return;
          if (e.key === "ArrowDown") {
            idx = (idx + 1) % items.length;
            draw();
            e.preventDefault();
          } else if (e.key === "ArrowUp") {
            idx = (idx - 1 + items.length) % items.length;
            draw();
            e.preventDefault();
          } else if (e.key === "Enter") {
            pick(items[idx]);
            e.preventDefault();
          }
        });
      }

      async function update(id, patch) {
        const p = byId(id);
        if (!p) return;
        Object.assign(p, patch);
        changed();
        if (isAdmin) {
          const { error } = await supabase
            .from("belgium_people")
            .update(patch)
            .eq("id", id);
          if (error) toast("Error updating person");
        }
      }
      async function addPerson(name, m, x, y, loc, geo = null) {
        const px = geo ? geoX(geo.lon) : Number(x),
          py = geo ? geoY(geo.lat) : Number(y);
        const p = {
          id: newId(),
          n: name,
          x: Number.isFinite(px) ? Math.round(px * 10) / 10 : null,
          y: Number.isFinite(py) ? Math.round(py * 10) / 10 : null,
          m: m || "",
          loc: loc || "",
          lat: geo ? geo.lat : null,
          lon: geo ? geo.lon : null,
        };
        people.push(p);
        changed();
        select(p.id, { fly: true });
        if (isAdmin) {
          const { error } = await supabase.from("belgium_people").insert([p]);
          if (error) toast("Error creating person");
        }
        return p;
      }
      async function removePerson(id) {
        const i = people.findIndex((p) => p.id === id);
        if (i < 0) return;
        people.splice(i, 1);
        selId = null;
        cardMode = "view";
        changed();
        toast("Person removed");
        if (isAdmin) {
          const { error } = await supabase
            .from("belgium_people")
            .delete()
            .eq("id", id);
          if (error) toast("Error deleting person");
        }
      }

      function renderPeopleList() {
        const list = $("#listPeople");
        if (!list) return;
        const gAz = $("#gAz"),
          gProv = $("#gProv");
        if (gAz) gAz.classList.toggle("on", ui.group === "az");
        if (gProv) gProv.classList.toggle("on", ui.group === "prov");
        list.classList.toggle("az-list", ui.group === "az");

        const q = norm(ui.qPeople);
        const arr = people
          .filter(
            (p) =>
              !q ||
              norm(p.n).includes(q) ||
              (muniOf(p) && norm(muniOf(p).n).includes(q)) ||
              (p.loc && norm(p.loc).includes(q)),
          )
          .sort(sortName);
        if (!arr.length) {
          list.replaceChildren(
            emptyMsg(
              q ? `No names match “${ui.qPeople}”.` : "Nobody on the map yet.",
            ),
          );
          return;
        }
        if (ui.group === "az") {
          const sections = new Map();
          for (const p of arr) {
            const first = Array.from(String(p.n || "").trim())[0] || "#";
            const letter = /\p{L}/u.test(first)
              ? first.toLocaleUpperCase()
              : "#";
            if (!sections.has(letter)) sections.set(letter, []);
            sections.get(letter).push(p);
          }
          const nodes = [];
          for (const [letter, ps] of sections) {
            nodes.push(
              h(
                "div",
                { class: "gh az-letter" },
                h("span", { text: letter }),
                h("span", { text: ps.length }),
              ),
            );
            nodes.push(...ps.map(personRow));
          }
          list.replaceChildren(...nodes);
          return;
        }

        const groups = PROV_ORDER.map((k) => [
          k,
          arr.filter((p) => provOf(p) === k),
        ]).filter((g) => g[1].length);
        const abroad = arr.filter((p) => isOutsideBelgium(p));
        const nodes = [];
        for (const [k, ps] of groups) {
          nodes.push(
            h(
              "div",
              { class: "gh" },
              h("button", {
                class: "link",
                type: "button",
                text: PROV[k].n,
                onclick: () => openDetail({ t: "prov", k }),
              }),
              h("span", { text: ps.length }),
            ),
          );
          nodes.push(...ps.map(personRow));
        }
        if (abroad.length) {
          nodes.push(
            h(
              "div",
              { class: "gh" },
              h("span", { text: "Outside Belgium" }),
              h("span", { text: abroad.length }),
            ),
          );
          nodes.push(...abroad.map(personRow));
        }
        list.replaceChildren(...nodes);
      }

      function copyNames() {
        const txt = people
          .slice()
          .sort(sortName)
          .map((p) => `${p.n} (${p.m || "Outside Belgium"})`)
          .join("\n");
        const done = () => toast("Names copied to clipboard");
        const fallback = () => {
          const ta = h("textarea", { class: "sr", readonly: "" });
          ta.value = txt;
          document.body.append(ta);
          ta.select();
          try {
            document.execCommand("copy");
            done();
          } catch (_) {
            toast("Could not copy names automatically.");
          }
          ta.remove();
        };
        try {
          navigator.clipboard.writeText(txt).then(done, fallback);
        } catch (_) {
          fallback();
        }
      }

      function downloadCsv() {
        const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
        const rows = [
          ["Name", "Municipality", "Province", "Region"].map(q).join(","),
        ];
        for (const p of people.slice().sort(sortName)) {
          const m = muniOf(p);
          rows.push(
            [
              p.n,
              m ? m.n : "Outside Belgium",
              m ? PROV[m.p].n : "",
              regionOf(p),
            ]
              .map(q)
              .join(","),
          );
        }
        const blob = new Blob(["\uFEFF" + rows.join("\n")], {
          type: "text/csv;charset=utf-8;",
        });
        const url = URL.createObjectURL(blob);
        const a = h("a", { href: url, download: "geoguessr-gelgium-map.csv" });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast("CSV file downloaded");
      }

          type: "password",
          placeholder: "Admin Password",

          wrap.hidden = true;
          wrap.replaceChildren();

        const submit = async () => {
          try {
            const { error } = await supabase.auth.signInWithPassword({
              email: "admin@belgiummap.local",
              password: passIn.value,
            });

            setAdminState(true);

            err.textContent = "Incorrect password.";
            err.hidden = false;
            passIn.value = "";
            passIn.focus();

        passIn.addEventListener("keydown", (e) => {

          h(

            h("h2", { text: "Admin Login" }),

          autocomplete: "off",
        });
        const muniIn = h("input", {
          type: "text",
          placeholder: "Belgian municipality (leave empty for abroad)",
          value: picked ? picked.n : "",
          autocomplete: "off",
        });
        const locIn = h("input", {
          type: "text",
          placeholder: "City, Country (e.g. Ulft, Netherlands)",
          autocomplete: "off",
        });
        const latIn = h("input", {
          type: "number",
          step: "any",
          placeholder: "e.g. 51.8910",
        });
        const lonIn = h("input", {
          type: "number",
          step: "any",
          placeholder: "e.g. 6.3843",
        });
        const geoFields = h(
          "div",
          { class: "geo-fields", hidden: true },
          h("label", { text: "Latitude" }),
          latIn,
          h("label", { text: "Longitude" }),
          lonIn,
        );
        const sug = h("ul", { class: "sug", hidden: true });
        const err = h("p", { class: "err", hidden: true });
        const close = () => {
          wrap.hidden = true;
          wrap.replaceChildren();
        };
        const fail = (t) => {
          err.textContent = t;
          err.hidden = false;
        };
        const placePinBtn = h("button", {
          class: "btn",
          type: "button",
          text: "Place pin on map",
          onclick: () => {
            const n = nameIn.value.trim();
            if (!n) {
              fail("Enter a name first.");
              nameIn.focus();
              return;
            }
            const typed = norm(muniIn.value);
            if (typed && (!picked || norm(picked.n) !== typed)) {
              const exact = MUNI.find(
                (q) =>
                  norm(q.n) === typed || q.al.some((a) => norm(a) === typed),
              );
              if (exact) picked = exact;
              else {
                fail(
                  "Unknown Belgian municipality. Leave this field empty for an international city.",
                );
                return;
              }
            }
            if (!typed) picked = null;
            const loc = locIn.value.trim();
            const international = isInternationalCityCountry(loc, picked);
            const geo = parseGeoInputs(latIn.value, lonIn.value);
            if (geo.error) {
              fail(geo.error);
              return;
            }
            if (international) {
              if (!geo.value) {
                fail(
                  "Enter the latitude and longitude for this international city.",
                );
                latIn.focus();
                return;
              }
              close();
              addPerson(n, "", null, null, loc, geo.value);
              return;
            }
            close();
            startPlacing(`Click map to place ${n}.`, (x, y) => {
              const placement = placementForBelgianMapPoint(x, y, loc);
              addPerson(
                n,
                placement.m,
                placement.x,
                placement.y,
                placement.loc,
              );
            });
          },
        });
        const syncGeoVisibility = () => {
          const international = isInternationalCityCountry(locIn.value, picked);
          geoFields.hidden = !international;
          placePinBtn.hidden = international;
        };
        autocomplete(muniIn, sug, (m) => {
          picked = m;
          syncGeoVisibility();
        });
        muniIn.addEventListener("input", syncGeoVisibility);
        locIn.addEventListener("input", syncGeoVisibility);

        const submit = () => {
          const n = nameIn.value.trim();
          err.hidden = true;
          if (!n) {
            fail("Enter a name.");
            nameIn.focus();
            return;
          }
          const typed = norm(muniIn.value);
          if (typed && (!picked || norm(picked.n) !== typed)) {
            const exact = MUNI.find(
              (q) => norm(q.n) === typed || q.al.some((a) => norm(a) === typed),
            );
            if (exact) picked = exact;
            else {
              fail(
                "Unknown Belgian municipality. Leave this field empty for an international city.",
              );
              return;
            }
          }
          if (!typed) picked = null;

          const loc = locIn.value.trim();
          const international = isInternationalCityCountry(loc, picked);
          const geo = parseGeoInputs(latIn.value, lonIn.value);
          if (geo.error) {
            fail(geo.error);
            return;
          }
          if (international) {
            if (!geo.value) {
              fail(
                "Enter the latitude and longitude for this international city.",
              );
              latIn.focus();
              return;
            }
            close();
            addPerson(n, "", null, null, loc, geo.value);
            return;
          }
          if (picked) {
            close();
            addPerson(n, picked.n, picked.x, picked.y, loc);
          } else if (geo.value) {
            if (!loc) {
              fail("Enter the city and country for these coordinates.");
              locIn.focus();
              return;
            }
            close();
            addPerson(n, "", null, null, loc, geo.value);
          } else {
            close();
            startPlacing(`Click map to place ${n}.`, (x, y) => {
              const placement = placementForBelgianMapPoint(x, y, loc);
              addPerson(
                n,
                placement.m,
                placement.x,
                placement.y,
                placement.loc,
              );
            });
          }
        };

        [nameIn, muniIn, locIn, latIn, lonIn].forEach((i) =>
          i.addEventListener("keydown", (e) => {
            if (e.key === "Enter") submit();
          }),
        );
        syncGeoVisibility();
        wrap.replaceChildren(
          h("div", { class: "dlg-bg", onclick: close }),
          h(
            "div",
            { class: "dlg", role: "dialog" },
            h("h2", { text: "Add a person" }),
            h("label", { text: "Name" }),
            nameIn,
            h("label", {
              text: "Belgian municipality (leave empty for abroad)",
            }),
            h("div", { class: "acwrap" }, muniIn, sug),
            h("label", { text: "City / Country" }),
            locIn,
            geoFields,
            err,
            h(
              "div",
              { class: "row-btns" },
              h("button", {
                class: "btn primary",
                text: "Continue",
                onclick: submit,
              }),
              placePinBtn,
              h("button", {
                class: "btn ghost",
                text: "Cancel",
                onclick: close,
              }),
            ),
          ),
        );
        setTimeout(() => nameIn.focus(), 0);
      }
      $("#btnAdd").onclick = () => openAdd(null);

      /*init*/
      supabase.auth
        .getSession()
        .then((res) => {
          const session = res?.data?.session;
          if (session) setAdminState(true);
        })
        .catch((err) => console.error("Session fetch failed", err));

      supabase
        .channel("public:belgium_people")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "belgium_people" },
          (payload) => {
            if (payload.eventType === "INSERT") {
              if (!byId(payload.new.id)) people.push(payload.new);
            } else if (payload.eventType === "UPDATE") {
              const p = byId(payload.new.id);
              if (p) Object.assign(p, payload.new);
            } else if (payload.eventType === "DELETE") {
              const i = people.findIndex((x) => x.id === payload.old.id);
              if (i >= 0) people.splice(i, 1);
            }
            changed();
          },
        )
        .subscribe();

      supabase
        .from("belgium_people")
        .select("*")
        .then(({ data, error }) => {
          if (error) console.error("Error fetching people", error);
          if (data && data.length) {
            people = data.map((p) => {
              const m = muniOf(p);
              if (m) {
                p.x = m.x;
                p.y = m.y;
              } else if (hasGeoCoordinates(p)) {
                const position = mapPosition(p);
                p.x = position.x;
                p.y = position.y;
              }
              return p;
            });
            changed();
          }
        })
        .catch((err) => console.error(err));

      buildPeople();
      buildPlaces();
      syncLabels();
      refreshCount();
      renderPeopleList();
      renderRightSide();
      paintLabels();
      new ResizeObserver(() => measure()).observe(mapEl);
      measure();
      if (document.fonts) document.fonts.ready.then(() => schedule());
      render();
    </script>
  </body>
</html>
